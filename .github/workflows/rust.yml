name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: audit

      - name: Checkout 
        uses: actions/checkout@v6
      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: cache-restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Rustup version
        run: rustup --version
      - name: Install Rust components
        run: rustup component add llvm-tools clippy rustfmt cargo
      - name: Install ninja-build (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Install Go (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install Cargo binaries
        run: |
          which cargo-llvm-cov || cargo install cargo-llvm-cov
          which cargo-deny || cargo install cargo-deny
      - name: Check licenses
        run: cargo-deny check licenses
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose --all-features --no-fail-fast --workspace --exclude integration-tests
      - name: Code Coverage
        run: cargo llvm-cov --all-features --workspace --exclude integration-tests --codecov --output-path ./codecov.json
      - name: Publish Code Coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./codecov.json
          fail_ci_if_error: true
          use_oidc: true
      - name: Analyze the PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -AcceptLicense
          # ParseError is its own severity: filtering to Error and Warning alone
          # would report a script PowerShell cannot even parse as clean.
          #
          # Excluded rules are style rather than defect: Write-Host is how these
          # scripts talk to an operator's console; common.ps1 is dot-sourced, so
          # its constants look unused; and the verb, noun, and ShouldProcess
          # conventions would mean renaming existing helpers across every caller.
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse `
            -Severity ParseError, Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseDeclaredVarsMoreThanAssignments, `
              PSUseApprovedVerbs, PSUseSingularNouns, PSUseShouldProcessForStateChangingFunctions
          if ($findings) {
            $findings | Format-Table RuleName, Line, Message -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)"
          }
          Write-Host "PSScriptAnalyzer: clean"

      - name: Lint
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Cache dependencies
        uses: actions/cache/save@v5
        if: steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
