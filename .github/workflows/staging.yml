name: Staging

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Daily at noon Pacific time
      timezone: "America/Los_Angeles"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write
  # Needed for integ tests
  pull-requests: write

jobs:
  integ:
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit
  publish:
    needs: [integ]
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-wcp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/aws-workload-credentials-provider${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: ${{ secrets.STAGING_ROLE_ARN }}
          role-session-name: aws-wcp-staging-${{ github.run_id }}
          aws-region: us-west-2

      - name: Upload artifacts to S3
        env:
          BUCKET: ${{ runner.os == 'Windows' && secrets.WINDOWS_STAGING_BUCKET || secrets.STAGING_BUCKET }}
          KEY_PREFIX: ${{ runner.os == 'Windows' && format('{0}/', secrets.STAGING_WINDOWS_BIN_PATH) || '' }}
          BIN: aws-workload-credentials-provider${{ matrix.ext }}
        shell: bash
        run: |
          aws s3 cp "target/${{ matrix.target }}/release/$BIN" "s3://$BUCKET/$KEY_PREFIX${{ github.run_id }}/${{ matrix.target }}/$BIN"
